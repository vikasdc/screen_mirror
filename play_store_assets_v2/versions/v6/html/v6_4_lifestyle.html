<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v6.css">
<style>
  .same-content {
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%),
      url('../photos/cinema_landscape.jpg');
    background-size: cover; background-position: center;
  }
</style>
</head>
<body>
<div class="canvas grad-a">

  <div style="position: absolute; top: 60px; left: 60px; z-index: 12;">
    <div class="aircast-wordmark">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
  </div>

  <h1 class="display h-120" style="position: absolute; top: 180px; left: 60px; right: 60px;
       text-align: center; line-height: 1.0;">
    HOLD YOUR<br>
    <span style="color: var(--yellow);">PHONE.</span><br>
    BIG SCREEN<br>
    DOES THE REST.
  </h1>

  <!-- BIG hand-phone real photo dominating lower section to satisfy the
       "arm/hand clearly visible" requirement -->
  <div class="hand-phone-photo" style="bottom: 240px; left: 60px;
       width: 480px; height: 600px; transform: rotate(-4deg);"></div>

  <!-- TV mockup upper-right showing same content (mirroring proof) -->
  <div class="tv" style="top: 700px; right: 60px;
       width: 520px; height: 310px;">
    <div class="scr"><div class="same-content" style="position: absolute; inset:0;"></div></div>
    <div class="timer"><span class="red">●</span> LIVE</div>
    <div class="res-badge">1080P</div>
  </div>

  <!-- yellow mirror beam linking the two -->
  <div class="beam" style="top: 980px; left: 540px; width: 240px; transform: rotate(15deg);"></div>

  <!-- "Mirrors in real time" sticker -->
  <div class="sticker" style="top: 660px; right: 60px;">
    <span class="red-dot"></span>
    Live Mirror!
  </div>

  <!-- bottom chip strip -->
  <div class="chip-row">
    <span class="chip"><img class="brand-mark" src="../brand_logos/samsung.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/lg.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/firetv.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/roku.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/chromecast.svg" alt=""></span>
  </div>

</div>
</body></html>
