<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v6.css">
</head>
<body>
<div class="canvas grad-b">

  <div style="position: absolute; top: 60px; left: 60px; z-index: 12;">
    <div class="aircast-wordmark">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
  </div>

  <!-- big real Aircast logo centred -->
  <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%);
       z-index: 10;">
    <div class="aircast-mark size-lg">
      <div class="gr"></div><div class="bl"></div>
    </div>
  </div>

  <h1 class="display h-140" style="position: absolute; top: 600px; left: 60px; right: 60px;
       text-align: center; line-height: 1.0;">
    GET ON<br>
    <span style="color: var(--yellow);">GOOGLE PLAY</span>
  </h1>

  <p class="body t-30" style="position: absolute; top: 940px; left: 60px; right: 60px;
       text-align: center;">
    Free with ads. No account. No subscription.<br>
    Download and cast.
  </p>

  <!-- CTA button -->
  <div style="position: absolute; top: 1180px; left: 0; right: 0; text-align: center; z-index: 12;">
    <span style="display: inline-flex; align-items: center; gap: 16px;
                 padding: 30px 56px; background: var(--yellow); color: var(--ink);
                 border-radius: 16px; border: 5px solid var(--ink);
                 font: 800 38px 'Plus Jakarta Sans', sans-serif;
                 letter-spacing: -0.02em;
                 box-shadow: 0 16px 40px rgba(0,0,0,0.4);">
      ▶ DOWNLOAD FREE
    </span>
  </div>

  <!-- trust strip -->
  <div style="position: absolute; top: 1350px; left: 0; right: 0; text-align: center; z-index: 12;
              display: flex; justify-content: center; gap: 12px;">
    <span style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
                 padding: 12px 22px; border-radius: 100px;
                 font: 700 22px 'Plus Jakarta Sans', sans-serif; color: #fff;
                 backdrop-filter: blur(10px);">
      ★★★★★
    </span>
    <span style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
                 padding: 12px 22px; border-radius: 100px;
                 font: 700 22px 'Plus Jakarta Sans', sans-serif; color: #fff;
                 backdrop-filter: blur(10px);">
      15 LANGUAGES
    </span>
    <span style="background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
                 padding: 12px 22px; border-radius: 100px;
                 font: 700 22px 'Plus Jakarta Sans', sans-serif; color: #fff;
                 backdrop-filter: blur(10px);">
      ANDROID 7+
    </span>
  </div>

  <!-- brand chip strip -->
  <div class="chip-row">
    <span class="chip"><img class="brand-mark" src="../brand_logos/samsung.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/lg.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/firetv.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/roku.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/chromecast.svg" alt=""></span>
  </div>

</div>
</body></html>
