<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v5.css">
<style>
  .lang-cloud {
    position: absolute;
    inset: 540px 30px 200px 30px;
  }
  .lp { position: absolute; }
</style>
</head>
<body>
<div class="canvas grad-c">

  <div style="position: absolute; top: 80px; left: 60px; right: 60px;
       display: flex; justify-content: space-between; align-items: center; z-index: 10;">
    <div class="aircast-logo" style="color:#0F1A2E;">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
    <span class="mono t-22" style="color:#0F1A2E; opacity: 0.7;">04 / LANGUAGES</span>
  </div>

  <h1 class="display h-110"
      style="position: absolute; top: 220px; left: 60px; right: 60px;
             color: #0F1A2E; text-shadow: none;">
    15 LANGUAGES.<br>
    <span style="color: #FF3CAC;">ZERO FRICTION.</span>
  </h1>

  <p class="body t-28"
     style="position: absolute; top: 440px; left: 60px; right: 60px;
            color: rgba(15,26,46,0.72); font-weight: 600;">
    Switch the app to your language in a tap — change anytime.
  </p>

  <!-- language word cloud (15 languages in their actual scripts) -->
  <div class="lang-cloud" style="inset: 580px 30px 200px 30px;">
    <span class="lp lang-pill"            style="top: 0px;   left: 40px;  transform: rotate(-6deg);">English</span>
    <span class="lp lang-pill solid-yellow" style="top: 30px;  right: 30px; transform: rotate(8deg);">Español</span>
    <span class="lp lang-pill solid-blue" style="top: 140px; left: 100px; transform: rotate(-4deg);">हिन्दी</span>
    <span class="lp lang-pill"            style="top: 130px; right: 80px; transform: rotate(5deg);">日本語</span>
    <span class="lp lang-pill solid-green" style="top: 250px; left: 30px;  transform: rotate(-8deg);">中文</span>
    <span class="lp lang-pill"            style="top: 250px; right: 160px; transform: rotate(3deg);">한국어</span>
    <span class="lp lang-pill solid-yellow" style="top: 360px; left: 200px; transform: rotate(-2deg);">العربية</span>
    <span class="lp lang-pill"            style="top: 370px; right: 20px;  transform: rotate(6deg);">Português</span>
    <span class="lp lang-pill solid-blue" style="top: 480px; left: 60px;   transform: rotate(-5deg);">Français</span>
    <span class="lp lang-pill"            style="top: 500px; right: 100px; transform: rotate(4deg);">Deutsch</span>
    <span class="lp lang-pill solid-green" style="top: 610px; left: 130px; transform: rotate(-3deg);">Italiano</span>
    <span class="lp lang-pill"            style="top: 610px; right: 40px;  transform: rotate(7deg);">Türkçe</span>
    <span class="lp lang-pill solid-yellow" style="top: 730px; left: 60px;  transform: rotate(-6deg);">Русский</span>
    <span class="lp lang-pill"            style="top: 740px; right: 200px; transform: rotate(2deg);">Tiếng Việt</span>
    <span class="lp lang-pill solid-blue" style="top: 850px; left: 220px;  transform: rotate(-4deg);">Bahasa</span>
  </div>

  <div style="position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; z-index: 10;">
    <span class="pill solid" style="background: #0F1A2E; color: #FFD60A;">🌍 CHANGE ANYTIME · IN ONE TAP</span>
  </div>

</div>
</body></html>
