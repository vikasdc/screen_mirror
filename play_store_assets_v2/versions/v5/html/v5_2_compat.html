<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v5.css">
</head>
<body>
<div class="canvas grad-a">

  <!-- top-left logo + top-right label -->
  <div style="position: absolute; top: 80px; left: 60px; right: 60px;
       display: flex; justify-content: space-between; align-items: center; z-index: 10;">
    <div class="aircast-logo">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
    <span class="mono t-22" style="color:#FFFFFF; opacity: 0.7;">02 / COMPATIBILITY</span>
  </div>

  <!-- huge headline -->
  <h1 class="display h-140"
      style="position: absolute; top: 220px; left: 60px; right: 60px;">
    WORKS WITH<br>
    <span class="accent">ANY TV.</span>
  </h1>

  <p class="body t-30"
     style="position: absolute; top: 540px; left: 60px; right: 60px;">
    Samsung. LG. Sony. Fire TV. Chromecast. Roku.<br>
    Hisense. TCL. Mi. Bravia. Vizio. Apple TV. Android TV.
  </p>

  <!-- 4x4 brand tile grid with REAL svg logos -->
  <div class="brand-grid"
       style="position: absolute; top: 740px; left: 60px; right: 60px;">
    <div class="brand-tile"><img class="logo" src="../brand_logos/samsung.svg" alt="Samsung"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/lg.svg" alt="LG"></div>
    <div class="brand-tile dark"><img class="logo" src="../brand_logos/sony.svg" alt="Sony"></div>
    <div class="brand-tile dark"><img class="logo" src="../brand_logos/bravia.svg" alt="Bravia"></div>

    <div class="brand-tile"><img class="logo" src="../brand_logos/firetv.svg" alt="Fire TV"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/chromecast.svg" alt="Chromecast"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/roku.svg" alt="Roku"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/appletv.svg" alt="Apple TV"></div>

    <div class="brand-tile"><img class="logo" src="../brand_logos/hisense.svg" alt="Hisense"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/vizio.svg" alt="Vizio"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/tcl.svg" alt="TCL"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/xiaomi.svg" alt="Mi"></div>

    <div class="brand-tile"><img class="logo" src="../brand_logos/panasonic.svg" alt="Panasonic"></div>
    <div class="brand-tile"><img class="logo" src="../brand_logos/androidtv.svg" alt="Android TV"></div>
    <div class="brand-tile" style="background: #FFD60A;">
      <span class="mono" style="font-size: 22px; color: #0F1A2E; line-height: 1.05;
                                text-transform: uppercase; letter-spacing: 0.06em;">+ MORE</span>
    </div>
    <div class="brand-tile dark"><img class="logo" src="../brand_logos/google.svg" alt="Google"></div>
  </div>

  <!-- pill at very bottom -->
  <div style="position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; z-index: 10;">
    <span class="pill solid">★ 15+ BRANDS · 99% COMPATIBILITY</span>
  </div>

</div>
</body></html>
