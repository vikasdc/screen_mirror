<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v5.css">
</head>
<body>
<div class="canvas grad-a">

  <div style="position: absolute; top: 80px; left: 60px; right: 60px;
       display: flex; justify-content: space-between; align-items: center; z-index: 10;">
    <div class="aircast-logo">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
    <span class="mono t-22" style="color:#FFFFFF; opacity: 0.7;">06 / GET IT</span>
  </div>

  <!-- big real aircast mark centred -->
  <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%);
       z-index: 10;">
    <div class="aircast-mark size-lg">
      <div class="gr"></div><div class="bl"></div>
    </div>
  </div>

  <h1 class="display h-170"
      style="position: absolute; top: 540px; left: 60px; right: 60px;
             text-align: center;">
    FREE.<br>
    <span class="accent">WITH ADS.</span>
  </h1>

  <p class="body t-44"
     style="position: absolute; top: 1010px; left: 60px; right: 60px;
            text-align: center; font-weight: 600;">
    No account. No subscription.<br>
    Just download and cast.
  </p>

  <!-- CTA button -->
  <div style="position: absolute; bottom: 360px; left: 0; right: 0; text-align: center; z-index: 10;">
    <span style="display: inline-flex; align-items: center; gap: 16px;
                 padding: 30px 56px;
                 background: #FFD60A;
                 color: #0F1A2E;
                 border-radius: 16px;
                 font-family: 'Switzer', sans-serif;
                 font-weight: 900; font-size: 38px;
                 letter-spacing: -0.02em;
                 box-shadow: 0 16px 40px rgba(0,0,0,0.4),
                             0 0 0 4px rgba(255,255,255,0.15);">
      ▶ GET ON GOOGLE PLAY
    </span>
  </div>

  <!-- tag row above CTA -->
  <div style="position: absolute; bottom: 260px; left: 0; right: 0; text-align: center; z-index: 10;">
    <span class="pill"><span class="dot"></span>★★★★★</span>
    <span class="pill" style="margin-left: 8px;"><span class="dot"></span>15 LANGUAGES</span>
    <span class="pill" style="margin-left: 8px;"><span class="dot"></span>ANDROID 7+</span>
  </div>

  <!-- brand chip strip -->
  <div class="chip-strip" style="bottom: 80px;">
    <span class="chip"><img class="brand-mark" src="../brand_logos/samsung.svg" alt="Samsung"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/lg.svg" alt="LG"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/firetv.svg" alt="Fire TV"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/roku.svg" alt="Roku"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/chromecast.svg" alt="Chromecast"></span>
  </div>

</div>
</body></html>
