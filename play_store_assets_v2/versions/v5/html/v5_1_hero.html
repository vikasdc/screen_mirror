<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v5.css">
<style>
  /* hero shot uses the real "hand-holding-phone-mirroring-to-TV" Unsplash photo
     under a saturated gradient so the photo provides the geometry/realism and
     the gradient gives v1-style viral colour. */
  .hero-photo {
    background-image: url('../photos/hero_mirror.jpg');
    background-position: center 30%;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- real photo backdrop + gradient overlay -->
  <div class="photo-grad hero-photo"></div>

  <!-- top capability pills -->
  <div class="pill-row">
    <span class="pill"><span class="dot live"></span>LIVE</span>
    <span class="pill"><span class="dot"></span>1080P HD</span>
    <span class="pill"><span class="dot"></span>NO WIRES</span>
  </div>

  <!-- top-left Aircast logo -->
  <div class="aircast-logo" style="position: absolute; top: 160px; left: 60px;">
    <div class="aircast-mark size-md">
      <div class="gr"></div><div class="bl"></div>
    </div>
    <span>AIRCAST</span>
  </div>

  <!-- huge headline center-left -->
  <h1 class="display h-170"
      style="position: absolute; top: 320px; left: 60px; right: 60px;">
    CAST<br>
    PHONE<br>
    TO <span class="accent">TV.</span>
  </h1>

  <!-- subhead -->
  <p class="body t-44"
     style="position: absolute; top: 1010px; left: 60px; right: 60px;
            color: rgba(255,255,255,0.95);">
    The phone in your hand.<br>
    The same picture on your TV.
  </p>

  <!-- brand chip strip at bottom with REAL logos -->
  <div class="chip-strip">
    <span class="chip"><img class="brand-mark" src="../brand_logos/samsung.svg" alt="Samsung"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/lg.svg" alt="LG"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/firetv.svg" alt="Fire TV"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/roku.svg" alt="Roku"></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/chromecast.svg" alt="Chromecast"></span>
  </div>

  <!-- "tap to cast" badge bottom-left -->
  <div style="position: absolute; bottom: 180px; left: 60px; z-index: 11;">
    <span class="pill solid">▶ TAP TO CAST</span>
  </div>

</div>
</body></html>
