<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v5.css">
<style>
  .lifestyle-photo {
    background-image: url('../photos/couple_couch.jpg');
    background-position: center 25%;
  }
  /* heavier overlay so the bold headline reads with high contrast over photo */
  .lifestyle-photo::before {
    background:
      linear-gradient(180deg, rgba(15,26,46,0.55) 0%, rgba(108,92,231,0.78) 60%, rgba(15,26,46,0.92) 100%);
  }
  /* small composite of phone + TV pair in lower section showing the same image */
  .same-content {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%),
      url('../photos/cinema_landscape.jpg');
    background-size: cover; background-position: center;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="photo-grad lifestyle-photo"></div>

  <div class="pill-row">
    <span class="pill"><span class="dot live"></span>LIVE</span>
    <span class="pill"><span class="dot"></span>SAME WI-FI</span>
    <span class="pill"><span class="dot"></span>NO LAG</span>
  </div>

  <h1 class="display h-200"
      style="position: absolute; top: 240px; left: 60px; right: 60px;">
    BIGGER<br>
    <span class="accent">MOMENTS.</span>
  </h1>

  <p class="body t-44"
     style="position: absolute; top: 720px; left: 60px; right: 60px;">
    Your phone in your hand.<br>
    Your movie on the wall.
  </p>

  <!-- small device pair lower-right showing same scene -->
  <div class="tv"
       style="bottom: 220px; left: 60px; width: 480px; height: 290px;">
    <div class="scr"><div class="same-content">
      <div style="position:absolute; top:12px; right:12px;
                  background: rgba(0,0,0,0.6); color:#fff;
                  padding: 4px 10px; border-radius: 4px;
                  font: 700 14px 'JetBrains Mono', monospace; letter-spacing: 0.06em;">● LIVE</div>
    </div></div>
  </div>
  <div class="phone"
       style="bottom: 100px; right: 60px; width: 240px; height: 510px;
              border-radius: 30px;">
    <div class="notch" style="width: 70px; height: 18px;"></div>
    <div class="scr"><div class="same-content"></div></div>
  </div>

  <!-- mirror beam between them -->
  <div class="beam"
       style="bottom: 350px; left: 540px; width: 240px; transform: rotate(8deg);"></div>

</div>
</body></html>
