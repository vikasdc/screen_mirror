<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v7.css">
</head>
<body>
<div class="canvas grad-b">

  <div style="position: absolute; top: 60px; left: 60px; z-index: 12;">
    <div class="aircast-wordmark">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
  </div>

  <h1 class="display h-110" style="position: absolute; top: 200px; left: 60px; right: 60px;
       text-align: center;">
    WATCH LIVE.<br>
    <span class="accent-y">ZERO LAG.</span>
  </h1>

  <!-- BIG TV with concert lights -->
  <div class="tv" style="top: 500px; left: 80px; width: 920px; height: 540px;">
    <div class="scr"><img class="scr-img" src="../photos/concert_lights.jpg"></div>
    <div class="timer"><span class="red">●</span> LIVE  47:31</div>
    <div class="res-badge">FULL HD · &lt;200MS</div>
  </div>

  <!-- Same content on phone (mirroring proof) -->
  <div class="phone" style="bottom: 280px; right: 70px;
       width: 320px; height: 680px; border-radius: 44px;">
    <div class="notch"></div>
    <div class="scr"><img class="scr-img" src="../photos/concert_lights.jpg"></div>
    <div class="timer"><span class="red">●</span> LIVE</div>
  </div>

  <!-- sticker -->
  <div class="sticker" style="top: 460px; right: 30px; background: #FFD60A;">
    <span class="red-dot"></span>
    Live stream!
  </div>

  <div class="beam" style="bottom: 800px; right: 220px; width: 220px; transform: rotate(-35deg);"></div>

  <!-- spec stat strip -->
  <div style="position: absolute; bottom: 100px; left: 0; right: 0;
       display: flex; justify-content: center; gap: 14px; z-index: 11;">
    <span class="chip">📺 1080P</span>
    <span class="chip">⚡ &lt;200MS</span>
    <span class="chip">📡 WI-FI 6</span>
  </div>

</div>
</body></html>
