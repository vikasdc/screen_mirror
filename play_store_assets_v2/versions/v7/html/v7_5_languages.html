<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v7.css">
<style>
  .lang-pill {
    display: inline-flex; align-items: center;
    background: #FFFFFF; color: var(--ink);
    padding: 16px 28px; border-radius: 100px;
    font-family: 'Manrope', sans-serif;
    font-weight: 800; font-size: 40px; letter-spacing: -0.02em;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    position: absolute;
  }
  .lang-pill.y { background: var(--yellow); color: var(--ink); }
  .lang-pill.g { background: var(--green); color: #fff; }
  .lang-pill.b { background: var(--blue); color: #fff; }
</style>
</head>
<body>
<div class="canvas grad-g">

  <div style="position: absolute; top: 60px; left: 60px; z-index: 12;">
    <div class="aircast-wordmark">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
  </div>

  <h1 class="display h-130" style="position: absolute; top: 200px; left: 60px; right: 60px;
       text-align: center;">
    15 LANGUAGES<br>
    <span class="accent-y">ONE TAP.</span>
  </h1>

  <p class="body t-30" style="position: absolute; top: 480px; left: 60px; right: 60px;
       text-align: center;">
    Switch instantly. Cast in your language. Change anytime.
  </p>

  <!-- scattered language pills in actual scripts -->
  <span class="lang-pill"     style="top: 640px; left: 60px;  transform: rotate(-6deg);">English</span>
  <span class="lang-pill y"   style="top: 660px; right: 60px; transform: rotate(8deg);">Español</span>
  <span class="lang-pill b"   style="top: 770px; left: 180px; transform: rotate(-4deg);">हिन्दी</span>
  <span class="lang-pill"     style="top: 790px; right: 100px; transform: rotate(5deg);">日本語</span>
  <span class="lang-pill g"   style="top: 900px; left: 80px;  transform: rotate(-8deg);">中文</span>
  <span class="lang-pill"     style="top: 900px; right: 220px; transform: rotate(3deg);">한국어</span>
  <span class="lang-pill y"   style="top: 1030px; left: 200px; transform: rotate(-2deg);">العربية</span>
  <span class="lang-pill"     style="top: 1030px; right: 60px;  transform: rotate(6deg);">Português</span>
  <span class="lang-pill b"   style="top: 1160px; left: 60px;   transform: rotate(-5deg);">Français</span>
  <span class="lang-pill"     style="top: 1170px; right: 140px; transform: rotate(4deg);">Deutsch</span>
  <span class="lang-pill g"   style="top: 1300px; left: 160px;  transform: rotate(-3deg);">Italiano</span>
  <span class="lang-pill"     style="top: 1310px; right: 60px;  transform: rotate(7deg);">Türkçe</span>
  <span class="lang-pill y"   style="top: 1430px; left: 100px;  transform: rotate(-6deg);">Русский</span>
  <span class="lang-pill"     style="top: 1450px; right: 200px; transform: rotate(2deg);">Tiếng Việt</span>
  <span class="lang-pill b"   style="top: 1560px; left: 260px;  transform: rotate(-4deg);">Bahasa</span>

  <!-- footer pill -->
  <div style="position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; z-index: 12;">
    <span style="display: inline-flex; align-items: center; gap: 10px;
                 background: var(--ink); color: var(--yellow);
                 padding: 18px 36px; border-radius: 100px;
                 font: 800 28px 'Manrope', sans-serif;
                 box-shadow: 0 12px 32px rgba(0,0,0,0.4);">
      🌍 SWITCH ANYTIME IN ONE TAP
    </span>
  </div>

</div>
</body></html>
