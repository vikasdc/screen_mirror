<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v7.css">
</head>
<body>
<div class="canvas grad-g">

  <div style="position: absolute; top: 60px; left: 60px; z-index: 12;">
    <div class="aircast-wordmark">
      <div class="aircast-mark size-md"><div class="gr"></div><div class="bl"></div></div>
      <span>AIRCAST</span>
    </div>
  </div>

  <h1 class="display h-130" style="position: absolute; top: 200px; left: 60px; right: 60px;
       text-align: center;">
    PHONE TO TV,<br>
    <span class="accent-y">IN ONE TAP.</span>
  </h1>

  <!-- BIG TV showing sunset beach, dominant in upper section -->
  <div class="tv" style="top: 530px; left: 80px; width: 920px; height: 540px;">
    <div class="scr"><img class="scr-img" src="../photos/sunset_beach.jpg"></div>
    <div class="timer"><span class="red">●</span> LIVE  1:22:25</div>
    <div class="res-badge">1080P · 60FPS</div>
  </div>

  <!-- "Real-time!" sticker overlapping TV top-right -->
  <div class="sticker" style="top: 490px; right: 30px;">
    <span class="red-dot"></span>
    Real-time!
  </div>

  <!-- Phone showing IDENTICAL content (same sunset_beach.jpg) — the mirroring proof -->
  <div class="phone" style="bottom: 280px; right: 60px;
       width: 320px; height: 680px; border-radius: 44px;">
    <div class="notch"></div>
    <div class="scr"><img class="scr-img" src="../photos/sunset_beach.jpg"></div>
    <div class="timer"><span class="red">●</span> LIVE</div>
  </div>

  <!-- mirror beam from phone toward TV -->
  <div class="beam" style="bottom: 800px; right: 220px; width: 240px; transform: rotate(-40deg);"></div>

  <!-- Supported Devices header + chip strip -->
  <div class="supported-header">▸ SUPPORTED DEVICES</div>
  <div class="chip-row">
    <span class="chip"><img class="brand-mark" src="../brand_logos/samsung.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/lg.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/firetv.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/roku.svg" alt=""></span>
    <span class="chip"><img class="brand-mark" src="../brand_logos/chromecast.svg" alt=""></span>
  </div>

</div>
</body></html>
