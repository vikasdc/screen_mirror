<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-paper">
  <!-- LEFT: text -->
  <div style="position: absolute; top: 120px; left: 100px; width: 800px;">
    <div class="tag">WIRELESS &middot; CAST</div>
    <h1 class="display" style="margin-top: 24px;">
      MIRROR.<br><span class="terra">CAST.</span>
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 700px;">
      Wireless screen mirror to any smart TV — instantly, in HD.
    </p>
  </div>

  <!-- RIGHT: TV + phone composition -->
  <!-- TV (background, larger) -->
  <div class="tv" style="top: 200px; right: 280px; width: 820px; height: 500px;">
    <div class="scr">
      <span class="live-badge">LIVE FROM PHONE</span>
      <span class="res-badge">1080P</span>
      <img class="fill" src="../../photos/sunset_beach.jpg" alt="">
    </div>
    <div class="stand"></div>
  </div>
  <!-- Phone (front, smaller) -->
  <div class="phone" style="top: 280px; right: 80px; width: 320px; height: 660px; transform: rotate(4deg);">
    <div class="notch"></div>
    <div class="scr">
      <span class="live-badge" style="top: 50px; left: 24px; padding: 6px 14px; font-size: 16px;">LIVE</span>
      <img class="fill" src="../../photos/sunset_beach.jpg" alt="">
    </div>
  </div>

  <!-- bottom-left brand chip strip -->
  <div style="position: absolute; bottom: 80px; left: 100px; display: flex; gap: 18px; align-items: center;">
    <div style="background: #fff; border-radius: 18px; padding: 18px 28px; box-shadow: 0 10px 24px rgba(31,26,20,0.12); height: 80px; display: flex; align-items: center;">
      <img src="../../brand_logos/samsung.svg" style="height: 44px;">
    </div>
    <div style="background: #fff; border-radius: 18px; padding: 18px 28px; box-shadow: 0 10px 24px rgba(31,26,20,0.12); height: 80px; display: flex; align-items: center;">
      <img src="../../brand_logos/lg.svg" style="height: 52px;">
    </div>
    <div style="background: #fff; border-radius: 18px; padding: 18px 28px; box-shadow: 0 10px 24px rgba(31,26,20,0.12); height: 80px; display: flex; align-items: center;">
      <img src="../../brand_logos/firetv.svg" style="height: 44px;">
    </div>
    <div style="background: #fff; border-radius: 18px; padding: 18px 28px; box-shadow: 0 10px 24px rgba(31,26,20,0.12); height: 80px; display: flex; align-items: center;">
      <img src="../../brand_logos/roku.svg" style="height: 52px;">
    </div>
    <div style="background: #fff; border-radius: 18px; padding: 18px 28px; box-shadow: 0 10px 24px rgba(31,26,20,0.12); height: 80px; display: flex; align-items: center;">
      <img src="../../brand_logos/chromecast.svg" style="height: 36px;">
    </div>
  </div>
</div>
</body></html>
