<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-terra">
  <!-- LEFT: huge 15 numeral -->
  <div style="position: absolute; top: 100px; left: 100px; width: 800px;">
    <div class="tag terra">GLOBAL</div>
    <div style="margin-top: 20px; font: 800 540px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.06em; color: var(--terra); line-height: 0.85;">
      15.
    </div>
    <div class="tag" style="margin-top: 40px;">LANGUAGES &middot; ONE TAP</div>
  </div>

  <!-- RIGHT: scattered language pills -->
  <span class="lang-pill"   style="top: 140px; right: 540px; transform: rotate(-6deg);">English</span>
  <span class="lang-pill y" style="top: 160px; right: 140px; transform: rotate(7deg);">Español</span>
  <span class="lang-pill g" style="top: 320px; right: 460px; transform: rotate(-4deg);">हिन्दी</span>
  <span class="lang-pill"   style="top: 340px; right: 80px;  transform: rotate(5deg);">日本語</span>
  <span class="lang-pill t" style="top: 500px; right: 380px; transform: rotate(-7deg);">中文</span>
  <span class="lang-pill"   style="top: 520px; right: 80px;  transform: rotate(3deg);">한국어</span>
  <span class="lang-pill p" style="top: 680px; right: 520px; transform: rotate(-3deg);">العربية</span>
  <span class="lang-pill"   style="top: 700px; right: 140px; transform: rotate(8deg);">Português</span>
  <span class="lang-pill d" style="top: 860px; right: 380px; transform: rotate(-5deg);">Français</span>
  <span class="lang-pill y" style="top: 880px; right: 80px;  transform: rotate(4deg);">Deutsch</span>
</div>
</body></html>
