<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-cream">
  <!-- left: AIRCAST logo + tagline -->
  <div style="position: absolute; top: 240px; left: 120px; width: 900px;">
    <div style="display: flex; align-items: center; gap: 36px;">
      <div class="aircast-mark lg"><div class="gr"></div><div class="bl"></div></div>
      <span style="font: 800 130px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em; color: var(--ink);">AIRCAST</span>
    </div>
    <h1 class="display md" style="margin-top: 80px;">
      <span class="terra">FREE.</span><br>FOREVER.
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 700px;">
      No sign-up. All TVs. Any language. Cast wirelessly in seconds.
    </p>
  </div>

  <!-- RIGHT: huge install button + stats -->
  <div style="position: absolute; top: 320px; right: 100px; width: 700px;">
    <div style="background: var(--ink); color: var(--cream); padding: 50px 70px; border-radius: 100px;
                display: flex; align-items: center; gap: 30px;
                font: 700 64px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em;
                box-shadow: 0 32px 60px rgba(31,26,20,0.35);">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:80px;height:80px;background:var(--saffron);border-radius:50%;color:var(--ink);font-size:42px;">▶</span>
      INSTALL
    </div>

    <!-- stats trio -->
    <div style="margin-top: 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
      <div style="background: #fff; border-radius: 24px; padding: 36px 20px; text-align: center; box-shadow: 0 14px 32px rgba(31,26,20,0.12);">
        <div style="font: 900 90px 'Bricolage Grotesque', sans-serif; color: var(--olive); line-height: 1; letter-spacing: -0.04em;">16</div>
        <div style="font: 800 18px 'Inter', sans-serif; color: var(--ink); margin-top: 8px; letter-spacing: 0.08em;">TV BRANDS</div>
      </div>
      <div style="background: #fff; border-radius: 24px; padding: 36px 20px; text-align: center; box-shadow: 0 14px 32px rgba(31,26,20,0.12);">
        <div style="font: 900 90px 'Bricolage Grotesque', sans-serif; color: var(--terra); line-height: 1; letter-spacing: -0.04em;">15</div>
        <div style="font: 800 18px 'Inter', sans-serif; color: var(--ink); margin-top: 8px; letter-spacing: 0.08em;">LANGUAGES</div>
      </div>
      <div style="background: #fff; border-radius: 24px; padding: 36px 20px; text-align: center; box-shadow: 0 14px 32px rgba(31,26,20,0.12);">
        <div style="font: 900 90px 'Bricolage Grotesque', sans-serif; color: var(--ink); line-height: 1; letter-spacing: -0.04em;">2s</div>
        <div style="font: 800 18px 'Inter', sans-serif; color: var(--ink); margin-top: 8px; letter-spacing: 0.08em;">TO CONNECT</div>
      </div>
    </div>
  </div>

  <div class="tag" style="position: absolute; bottom: 80px; left: 0; right: 0; text-align: center;">
    NO SIGN-UP &middot; ALL TVs &middot; ANY LANGUAGE
  </div>
</div>
</body></html>
