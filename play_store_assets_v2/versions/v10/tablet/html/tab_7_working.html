<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-paper">
  <div style="position: absolute; top: 160px; left: 100px; width: 760px;">
    <div class="tag">SLIDES &middot; SHEETS &middot; DOCS</div>
    <h1 class="display" style="margin-top: 24px;">
      PRESENT.<br><span class="olive">PROUDLY.</span>
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 700px;">
      Mirror your deck on the big screen &mdash; clear, instant, no dongles.
    </p>
  </div>

  <!-- TV with slide -->
  <div class="tv" style="top: 220px; right: 280px; width: 820px; height: 500px;">
    <div class="scr">
      <div class="slidefill">
        <div class="h">REVENUE UP<br><span class="acc">38% YoY.</span></div>
        <div class="sub">Strong growth across every region</div>
        <div class="chart">
          <div class="chart-title">QUARTERLY REVENUE — USD MILLIONS</div>
          <div class="bars">
            <div class="bar a"></div><div class="bar b"></div><div class="bar c"></div>
            <div class="bar d"></div><div class="bar e"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <!-- Phone with same slide -->
  <div class="phone" style="top: 300px; right: 80px; width: 320px; height: 660px; transform: rotate(4deg);">
    <div class="notch"></div>
    <div class="scr">
      <div class="slidefill" style="padding: 80px 18px 18px;">
        <div class="h" style="font-size: 28px;">REVENUE UP<br><span class="acc">38%.</span></div>
        <div class="chart" style="margin-top: 18px; padding: 14px; height: 200px;">
          <div class="chart-title" style="font-size: 9px; margin-bottom: 10px;">QUARTERLY · USDm</div>
          <div class="bars" style="height: 150px; gap: 6px;">
            <div class="bar a"></div><div class="bar b"></div><div class="bar c"></div>
            <div class="bar d"></div><div class="bar e"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
