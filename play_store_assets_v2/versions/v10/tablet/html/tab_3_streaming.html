<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-paper">
  <div style="position: absolute; top: 160px; left: 100px; width: 760px;">
    <div class="tag terra">MOVIES &middot; SHOWS &middot; LIVE</div>
    <h1 class="display" style="margin-top: 24px;">
      STREAM.<br><span class="terra">BIGGER.</span>
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 700px;">
      Cinematic on the big screen. Same content, no cables.
    </p>
  </div>

  <!-- TV showing mountain doc -->
  <div class="tv" style="top: 220px; right: 280px; width: 820px; height: 500px;">
    <div class="scr">
      <span class="live-badge">LIVE</span>
      <span class="res-badge">4K HDR</span>
      <img class="fill" src="../../photos/mountain.jpg" alt="">
      <div style="position:absolute;bottom:24px;left:30px;right:30px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,0.5);">
        <div style="font:800 32px 'Bricolage Grotesque',sans-serif;letter-spacing:-0.02em;">EARTH FROM ABOVE</div>
        <div style="font:600 16px 'Inter',sans-serif;color:rgba(255,255,255,0.85);margin-top:4px;letter-spacing:0.04em;">EP 4 &middot; 42 OF 60 MIN</div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <!-- Phone showing same content -->
  <div class="phone" style="top: 300px; right: 80px; width: 320px; height: 660px; transform: rotate(4deg);">
    <div class="notch"></div>
    <div class="scr">
      <span class="live-badge" style="top: 50px; left: 24px; padding: 6px 14px; font-size: 16px;">LIVE</span>
      <img class="fill" src="../../photos/mountain.jpg" alt="">
    </div>
  </div>
</div>
</body></html>
