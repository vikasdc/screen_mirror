<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-cream">
  <div style="position: absolute; top: 160px; left: 120px; width: 900px;">
    <div class="tag">OUR APP</div>
    <h1 class="display" style="margin-top: 24px;">
      OPEN.<br><span class="olive">SEARCH.</span>
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 760px;">
      Open Aircast, tap Search for TVs &mdash; your TV shows up in seconds.
    </p>

    <div style="margin-top: 56px; display: flex; gap: 50px;">
      <div style="display: flex; align-items: center; gap: 18px;">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: var(--olive); color: var(--cream); display: flex; align-items: center; justify-content: center; font: 900 30px 'Bricolage Grotesque', sans-serif;">1</div>
        <div>
          <div style="font: 800 24px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em;">Open Aircast</div>
          <div style="font: 600 16px 'Inter', sans-serif; color: var(--ink-soft); margin-top: 2px;">Hero card + Search button</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <div style="width: 64px; height: 64px; border-radius: 18px; background: var(--terra); color: var(--cream); display: flex; align-items: center; justify-content: center; font: 900 30px 'Bricolage Grotesque', sans-serif;">2</div>
        <div>
          <div style="font: 800 24px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em;">Tap Search</div>
          <div style="font: 600 16px 'Inter', sans-serif; color: var(--ink-soft); margin-top: 2px;">Discover smart TVs nearby</div>
        </div>
      </div>
    </div>
  </div>

  <!-- phone with app home on the right -->
  <div class="phone" style="top: 80px; right: 180px; width: 440px; height: 920px; border-radius: 56px;">
    <div class="notch"></div>
    <div class="scr">
      <div class="app-home">
        <div class="hdr">
          <div class="lg"><div class="g"></div><div class="b"></div></div>
          <div class="nm">Aircast</div>
        </div>
        <div class="greet">Cast to any <span class="acc">TV.</span></div>
        <div class="sub">Wireless screen mirror &middot; HD</div>
        <div class="hero">
          <div class="lbl">Mirror in HD</div>
          <div class="sub2">phone → TV, 1080P</div>
          <div class="ph"></div>
          <div class="bm"></div>
          <div class="tv"></div>
        </div>
        <div class="sbtn">
          <div class="ic">⌕</div>
          <div class="lab">
            <div class="t">Search for TVs</div>
            <div class="s">Detect nearby smart TVs</div>
          </div>
          <div class="ar">›</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
