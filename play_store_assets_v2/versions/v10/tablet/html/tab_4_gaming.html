<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_tab.css">
</head>
<body>
<div class="canvas bg-cream">
  <div style="position: absolute; top: 160px; left: 100px; width: 760px;">
    <div class="tag terra">PLAY ON THE BIG SCREEN</div>
    <h1 class="display" style="margin-top: 24px;">
      GAME.<br><span class="terra">HUGE.</span>
    </h1>
    <p class="cap" style="margin-top: 36px; max-width: 700px;">
      Mirror mobile games to your TV with real-time response.
    </p>
  </div>

  <!-- TV with game scene -->
  <div class="tv" style="top: 220px; right: 280px; width: 820px; height: 500px;">
    <div class="scr">
      <div class="gamefill">
        <div class="sun"></div>
        <div class="hud-top">
          <div class="score">SCORE<br><span class="v">128,400</span></div>
          <div class="lap">LAP 03 / 05</div>
        </div>
        <div class="speedo">
          <div class="n">214</div>
          <div class="u">KM / H</div>
        </div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <!-- Phone with same game -->
  <div class="phone" style="top: 300px; right: 80px; width: 320px; height: 660px; transform: rotate(4deg);">
    <div class="notch"></div>
    <div class="scr">
      <div class="gamefill">
        <div class="sun"></div>
        <div class="speedo">
          <div class="n" style="font-size: 70px;">214</div>
          <div class="u" style="font-size: 14px;">KM / H</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
