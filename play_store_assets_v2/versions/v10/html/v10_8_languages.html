<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v10.css">
</head>
<body>
<div class="canvas bg-terra">
  <div class="tag terra" style="position: absolute; top: 120px; left: 0; right: 0; text-align: center; z-index: 10;">
    GLOBAL
  </div>

  <!-- huge numeral as design element -->
  <h1 class="display" style="position: absolute; top: 200px; left: 60px; right: 60px; text-align: center; font-size: 380px; line-height: 0.9;">
    <span class="terra">15.</span>
  </h1>

  <div class="tag" style="position: absolute; top: 640px; left: 0; right: 0; text-align: center; z-index: 10;">
    LANGUAGES &middot; ONE TAP
  </div>

  <!-- scattered language pills, minimal but expressive -->
  <span class="lang-pill"       style="top: 760px; left: 80px;  transform: rotate(-6deg);">English</span>
  <span class="lang-pill saff"  style="top: 760px; right: 100px;transform: rotate(7deg);">Español</span>
  <span class="lang-pill olive" style="top: 920px; left: 200px; transform: rotate(-4deg);">हिन्दी</span>
  <span class="lang-pill"       style="top: 920px; right: 60px; transform: rotate(5deg);">日本語</span>
  <span class="lang-pill terra" style="top: 1080px; left: 60px; transform: rotate(-7deg);">中文</span>
  <span class="lang-pill"       style="top: 1080px; right: 230px;transform: rotate(4deg);">한국어</span>
  <span class="lang-pill plum"  style="top: 1240px; left: 220px;transform: rotate(-3deg);">العربية</span>
  <span class="lang-pill"       style="top: 1240px; right: 70px;transform: rotate(8deg);">Português</span>
  <span class="lang-pill ink"   style="top: 1400px; left: 100px;transform: rotate(-5deg);">Français</span>
  <span class="lang-pill"       style="top: 1400px; right: 180px;transform: rotate(6deg);">Deutsch</span>
  <span class="lang-pill saff"  style="top: 1560px; left: 240px;transform: rotate(-2deg);">Italiano</span>
  <span class="lang-pill"       style="top: 1560px; right: 90px;transform: rotate(4deg);">Русский</span>
</div>
</body></html>
