<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v10.css">
<style>
  /* CSS-rendered "game world" — a stylized racing scene with HUD */
  .game-scene {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255,140,60,0.35) 0%, transparent 50%),
      radial-gradient(ellipse at 30% 20%, rgba(140,80,220,0.4) 0%, transparent 60%),
      linear-gradient(180deg, #1B0F2A 0%, #4B1F44 45%, #C5384A 100%);
    overflow: hidden;
  }
  /* horizon grid (synthwave-style) */
  .game-scene::before {
    content: ""; position: absolute;
    left: -10%; right: -10%; bottom: 0; height: 55%;
    background-image:
      linear-gradient(to right, rgba(255,140,200,0.4) 1px, transparent 1px),
      linear-gradient(to top, rgba(255,140,200,0.4) 1px, transparent 1px);
    background-size: 40px 40px;
    transform: perspective(300px) rotateX(60deg);
    transform-origin: bottom;
    opacity: 0.55;
  }
  /* sun */
  .game-scene::after {
    content: ""; position: absolute;
    left: 50%; bottom: 50%; transform: translateX(-50%);
    width: 60%; aspect-ratio: 1;
    background: radial-gradient(circle at center, #FFE680 0%, #FF8C3C 40%, transparent 70%);
    border-radius: 50%;
  }
  /* HUD overlays */
  .hud {
    position: absolute; inset: 0; padding: 16px;
    color: #fff; font-family: 'Inter', sans-serif;
    z-index: 3;
  }
  .hud .top-row {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .hud .score {
    background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 12px;
    font: 800 14px 'Bricolage Grotesque', sans-serif; letter-spacing: 0.06em;
  }
  .hud .score .v { font-size: 24px; }
  .hud .lap {
    background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
    padding: 8px 16px; border-radius: 12px;
    font: 800 14px 'Bricolage Grotesque', sans-serif;
  }
  .hud .speedo {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  .hud .speedo .n {
    font: 900 56px 'Bricolage Grotesque', sans-serif;
    color: #FFE680; text-shadow: 0 2px 12px rgba(255,140,60,0.6);
    line-height: 1;
  }
  .hud .speedo .u {
    font: 700 12px 'Inter', sans-serif; letter-spacing: 0.18em;
    color: rgba(255,255,255,0.85); margin-top: 2px;
  }
  .hud .health {
    position: absolute; left: 16px; bottom: 16px;
    width: 140px;
  }
  .hud .health .lbl { font: 700 11px 'Inter', sans-serif; letter-spacing: 0.16em; margin-bottom: 4px; }
  .hud .health .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.18); position: relative; }
  .hud .health .bar::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 78%;
    background: linear-gradient(90deg, #4FE08A 0%, #B4E843 100%);
    border-radius: 5px;
  }
  /* bigger version for TV */
  .tv .hud { padding: 22px; }
  .tv .hud .score, .tv .hud .lap { font: 800 20px 'Bricolage Grotesque', sans-serif; padding: 12px 22px; border-radius: 16px; }
  .tv .hud .score .v { font-size: 36px; }
  .tv .hud .speedo .n { font-size: 88px; }
  .tv .hud .speedo .u { font-size: 18px; }
  .tv .hud .health { width: 240px; }
  .tv .hud .health .lbl { font-size: 16px; }
  .tv .hud .health .bar { height: 16px; }
</style>
</head>
<body>
<div class="canvas bg-cream">
  <div class="tag" style="position: absolute; top: 120px; left: 0; right: 0; text-align: center; z-index: 10;">
    PLAY ON THE BIG SCREEN
  </div>

  <h1 class="display" style="position: absolute; top: 200px; left: 60px; right: 60px; text-align: center;">
    GAME.<br><span class="terra">HUGE.</span>
  </h1>

  <!-- TV with game scene -->
  <div class="tv" style="top: 760px; left: 50px; width: 640px; height: 400px;">
    <div class="scr">
      <div class="game-scene">
        <div class="hud">
          <div class="top-row">
            <div class="score">SCORE<br><span class="v">128,400</span></div>
            <div class="lap">LAP 03 / 05</div>
          </div>
          <div class="health">
            <div class="lbl">FUEL</div>
            <div class="bar"></div>
          </div>
          <div class="speedo">
            <div class="n">214</div>
            <div class="u">KM / H</div>
          </div>
        </div>
      </div>
    </div>
    <div class="stand"></div>
  </div>

  <!-- phone showing same game (mirror) -->
  <div class="phone" style="top: 880px; right: 50px; width: 460px; height: 920px; transform: rotate(3deg);">
    <div class="notch"></div>
    <div class="scr">
      <div class="game-scene">
        <div class="hud">
          <div class="top-row">
            <div class="score">SCORE<br><span class="v">128,400</span></div>
            <div class="lap">LAP 03</div>
          </div>
          <div class="health">
            <div class="lbl">FUEL</div>
            <div class="bar"></div>
          </div>
          <div class="speedo">
            <div class="n">214</div>
            <div class="u">KM / H</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
