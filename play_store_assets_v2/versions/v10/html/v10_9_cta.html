<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v10.css">
</head>
<body>
<div class="canvas bg-cream">
  <!-- aircast logo (the one place it belongs) -->
  <div style="position: absolute; top: 280px; left: 0; right: 0; text-align: center; z-index: 12;
              display: flex; align-items: center; justify-content: center; gap: 30px;">
    <div class="aircast-mark lg"><div class="gr"></div><div class="bl"></div></div>
    <span style="font: 800 110px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em; color: var(--ink);">AIRCAST</span>
  </div>

  <h1 class="display md" style="position: absolute; top: 720px; left: 60px; right: 60px; text-align: center;">
    <span class="terra">FREE.</span><br>FOREVER.
  </h1>

  <!-- big install pill -->
  <div style="position: absolute; top: 1240px; left: 0; right: 0; text-align: center; z-index: 11;">
    <span style="display: inline-flex; align-items: center; gap: 20px;
                 background: var(--ink); color: var(--cream);
                 padding: 36px 72px; border-radius: 100px;
                 font: 700 52px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em;
                 box-shadow: 0 22px 48px rgba(31,26,20,0.32);">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;background:var(--saffron);border-radius:50%;color:var(--ink);font-size:30px;">▶</span>
      INSTALL
    </span>
  </div>

  <!-- minimal supporting line -->
  <div class="tag" style="position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; z-index: 10;">
    NO SIGN-UP &middot; ALL TVs &middot; ANY LANGUAGE
  </div>
</div>
</body></html>
