<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v10.css">
</head>
<body>
<div class="canvas bg-paper">
  <!-- minimal tag -->
  <div class="tag" style="position: absolute; top: 120px; left: 0; right: 0; text-align: center; z-index: 10;">
    WIRELESS &middot; CAST
  </div>

  <!-- giant 2-word headline -->
  <h1 class="display" style="position: absolute; top: 200px; left: 60px; right: 60px; text-align: center;">
    MIRROR.<br><span class="terra">CAST.</span>
  </h1>

  <!-- TV with same image -->
  <div class="tv" style="top: 800px; left: 50px; width: 640px; height: 400px;">
    <div class="scr">
      <span class="live-badge">LIVE</span>
      <img class="fill" src="../photos/sunset_beach.jpg" alt="">
    </div>
    <div class="stand"></div>
  </div>

  <!-- phone (bigger, dominant) showing same image -->
  <div class="phone" style="top: 920px; right: 50px; width: 460px; height: 920px; transform: rotate(3deg);">
    <div class="notch"></div>
    <div class="scr">
      <span class="live-badge" style="top: 50px; left: 28px;">LIVE</span>
      <img class="fill" src="../photos/sunset_beach.jpg" alt="">
    </div>
  </div>
</div>
</body></html>
