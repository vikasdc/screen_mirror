<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_feature.css">
</head>
<body>
<div class="canvas">
  <!-- AIRCAST logo top-left -->
  <div style="position: absolute; top: 22px; left: 50px; display: flex; align-items: center; gap: 14px;">
    <div class="aircast-mark" style="width: 44px; height: 44px;">
      <div class="gr" style="width: 25px; height: 34px; top: 5px; border-radius: 10px;"></div>
      <div class="bl" style="width: 34px; height: 25px; bottom: 5px; border-radius: 10px;"></div>
    </div>
    <span style="font: 800 40px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em; color: var(--ink);">AIRCAST</span>
  </div>

  <!-- eyebrow tag above headline -->
  <div style="position: absolute; top: 84px; left: 50px;
              font: 700 16px 'Inter', sans-serif; color: var(--olive);
              letter-spacing: 0.22em; text-transform: uppercase;">
    WIRELESS &middot; HD &middot; ONE TAP
  </div>

  <!-- Big headline left side, 3 lines -->
  <h1 style="position: absolute; top: 112px; left: 50px; right: 400px;
             font: 800 88px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.045em;
             line-height: 0.94; color: var(--ink); margin: 0;">
    MIRROR PHONE<br>TO <span style="color: var(--terra);">ANY TV.</span>
  </h1>

  <!-- TV + phone on the right (top area) -->
  <div class="tv" style="top: 22px; right: 130px; width: 250px; height: 156px;">
    <div class="scr">
      <span class="live-tag">LIVE</span>
      <img src="../photos/sunset_beach.jpg" alt="">
    </div>
    <div class="stand"></div>
  </div>
  <div class="phone" style="top: 56px; right: 24px; width: 118px; height: 235px; transform: rotate(5deg);">
    <div class="notch"></div>
    <div class="scr">
      <span class="live-tag" style="top: 18px; left: 12px;">LIVE</span>
      <img src="../photos/sunset_beach.jpg" alt="">
    </div>
  </div>

  <!-- Bottom brand strip — bigger logos, full bottom edge -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 140px;
              background: rgba(255,255,255,0.55); backdrop-filter: blur(8px);
              border-top: 1px solid rgba(31,26,20,0.1);
              display: flex; align-items: center; justify-content: center;
              gap: 16px; padding: 0 24px;">
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; align-items: center; justify-content: center; flex: 1; max-width: 175px;">
      <img src="../brand_logos/samsung.svg" style="height: 54px; max-width: 100%;">
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; align-items: center; justify-content: center; flex: 1; max-width: 130px;">
      <img src="../brand_logos/lg.svg" style="height: 70px; max-width: 100%;">
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; align-items: center; justify-content: center; flex: 1; max-width: 150px;">
      <img src="../brand_logos/firetv.svg" style="height: 58px; max-width: 100%;">
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; align-items: center; justify-content: center; flex: 1; max-width: 130px;">
      <img src="../brand_logos/roku.svg" style="height: 70px; max-width: 100%;">
    </div>
    <div style="background: #fff; border-radius: 16px; padding: 16px 26px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; align-items: center; justify-content: center; flex: 1; max-width: 210px;">
      <img src="../brand_logos/chromecast.svg" style="height: 50px; max-width: 100%;">
    </div>
    <div style="background: var(--saffron); border-radius: 16px; padding: 16px 22px;
                box-shadow: 0 6px 18px rgba(31,26,20,0.14); height: 100px;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                font: 900 28px 'Bricolage Grotesque', sans-serif; color: var(--ink);
                letter-spacing: -0.02em; line-height: 0.95;">
      +11<br><span style="font-size: 18px; letter-spacing: 0.06em;">MORE</span>
    </div>
  </div>
</div>
</body></html>
