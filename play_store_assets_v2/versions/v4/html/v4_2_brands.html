<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v4.css">
<style>
  .brand-grid {
    position: absolute;
    top: 540px; left: 60px; right: 60px; bottom: 200px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr;
    gap: 18px;
  }
  /* Each tile = white background, real brand logo SVG at 60-75% size */
  .brand-tile img.logo {
    max-width: 70%;
    max-height: 60%;
    object-fit: contain;
  }
  /* Slight contrast tweaks for very dark monochrome SVGs */
  .brand-tile.dark-bg { background: #0F1A2E; }
  .brand-tile.dark-bg img.logo { filter: invert(1) brightness(1.5); }
</style>
</head>
<body>
<div class="canvas surf-paper grid-bg">
  <div style="position:absolute; top: 80px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;">
    <div class="air-logo size-md">
      <div class="mark"><div class="rect-green"></div><div class="rect-blue"></div></div>
      <span class="name" style="font-size: 36px;">AIRCAST</span>
    </div>
    <div class="label" style="color: var(--air-ink); opacity: 0.55;">02 / COMPATIBILITY</div>
  </div>

  <h1 class="mono h-110" style="position: absolute; top: 220px; left: 80px; right: 80px;">
    EVERY TV.<br>
    EVERY <span style="color: var(--air-blue);">STICK.</span>
  </h1>
  <p class="body t-32" style="position: absolute; top: 440px; left: 80px; right: 320px;
       color: var(--air-ink); opacity: 0.7; font-weight: 500;">
    Works with the smart TV or streaming device you already own.
  </p>

  <!-- 3x3 grid of REAL brand SVG logos -->
  <div class="brand-grid">
    <div class="brand-tile">
      <span class="kind">Smart TV</span>
      <img class="logo" src="../brand_logos/samsung.svg" alt="Samsung">
    </div>
    <div class="brand-tile">
      <span class="kind">Smart TV</span>
      <img class="logo" src="../brand_logos/lg.svg" alt="LG">
    </div>
    <div class="brand-tile dark-bg">
      <span class="kind" style="color: rgba(255,255,255,0.5);">Bravia</span>
      <img class="logo" src="../brand_logos/sony.svg" alt="Sony">
    </div>
    <div class="brand-tile">
      <span class="kind">Stick</span>
      <img class="logo" src="../brand_logos/amazon.svg" alt="Fire TV">
    </div>
    <div class="brand-tile">
      <span class="kind">Google</span>
      <img class="logo" src="../brand_logos/chromecast.svg" alt="Chromecast">
    </div>
    <div class="brand-tile">
      <span class="kind">Stick</span>
      <img class="logo" src="../brand_logos/roku.svg" alt="Roku">
    </div>
    <div class="brand-tile">
      <span class="kind">Smart TV</span>
      <img class="logo" src="../brand_logos/tcl.svg" alt="TCL">
    </div>
    <div class="brand-tile">
      <span class="kind">Mi TV</span>
      <img class="logo" src="../brand_logos/xiaomi.svg" alt="Xiaomi">
    </div>
    <div class="brand-tile">
      <span class="kind">Smart TV</span>
      <img class="logo" src="../brand_logos/panasonic.svg" alt="Panasonic">
    </div>
  </div>

  <div style="position: absolute; bottom: 110px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;">
    <span class="tag" style="color: var(--air-ink);"><span class="dot"></span>11+ BRANDS SUPPORTED</span>
    <p class="body t-22" style="color: var(--air-ink); opacity: 0.55; font-weight: 500;">
      + Hisense, Vizio, Bravia, Android TV
    </p>
  </div>
</div>
</body></html>
