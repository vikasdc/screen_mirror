<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v4.css">
<style>
  .blue-panel { position: absolute; inset: 0; background: #4285F4; }
  .one {
    position: absolute;
    top: 280px; left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 1100px;
    line-height: 0.85;
    color: #FAFAF7;
    letter-spacing: -0.08em;
    text-shadow: 16px 16px 0 rgba(15,26,46,0.55);
  }
  .one .ms {
    position: absolute;
    top: 80px; right: 220px;
    font-size: 56px;
    font-weight: 600;
    color: #FAFAF7;
    opacity: 0.7;
    letter-spacing: 0;
    text-shadow: none;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="blue-panel"></div>

  <div style="position:absolute; top: 80px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;
       color: #FAFAF7;">
    <div class="air-logo size-md" style="color: #FAFAF7;">
      <div class="mark">
        <div class="rect-green" style="background: rgba(255,255,255,0.55);"></div>
        <div class="rect-blue" style="background: #FAFAF7;"></div>
      </div>
      <span class="name" style="font-size: 36px;">AIRCAST</span>
    </div>
    <div class="label" style="color: #FAFAF7; opacity: 0.7;">05 / SPEED</div>
  </div>

  <div class="one">
    <span class="ms">tap</span>
    1
  </div>

  <!-- Body in Satoshi, NOT italic serif -->
  <p class="body" style="position: absolute; bottom: 320px; left: 0; right: 0;
       font-size: 64px; font-weight: 700; line-height: 1.1;
       color: #FAFAF7; text-align: center;">
    Tap to cast.<br>
    That's it.
  </p>

  <div class="phone neopop" style="bottom: 80px; right: 80px; width: 200px; height: 420px; border-radius: 26px;
       box-shadow: 6px 6px 0 0 rgba(15,26,46,0.85), 0 0 0 2px rgba(15,26,46,0.85);">
    <div class="notch" style="width: 56px; height: 14px; top: 14px;"></div>
    <div class="scr" style="background: #0F1A2E; padding: 56px 14px 14px;">
      <div style="background: #1A2C45; border-radius: 12px; padding: 14px; margin-bottom: 10px;
           font: 700 11px 'JetBrains Mono', monospace; color: #FAFAF7; letter-spacing: 0.08em;
           text-align: center;">
        CONNECT TO TV
      </div>
      <div style="background: #34A853; border-radius: 100px; padding: 16px 18px;
           font: 800 13px 'JetBrains Mono', monospace; color: #FAFAF7;
           text-align: center; letter-spacing: 0.04em;
           box-shadow: 0 0 0 4px rgba(52,168,83,0.35);">
        SEARCH FOR TVs
      </div>
      <p class="body" style="font-size: 9px; color: rgba(250,250,247,0.55);
         text-align: center; margin-top: 14px;">
        Scan and connect to displays nearby
      </p>
    </div>
  </div>

  <div style="position: absolute; bottom: 100px; left: 80px;">
    <div class="tag" style="color: #FAFAF7; border-color: rgba(255,255,255,0.6);">
      <span class="dot" style="background: #FAFAF7;"></span>
      AVG SETUP · 2 SECONDS
    </div>
  </div>
</div>
</body></html>
