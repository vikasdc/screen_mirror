<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="canvas bg-tropics">

  <h1 class="headline size-xl" style="padding-top: 140px;">
    15 Languages.<br>
    <span class="accent">Zero Friction.</span>
  </h1>
  <p class="subhead size-md">
    English, Español, हिन्दी, العربية, 中文, 日本語, 한국어,<br>
    Français, Deutsch, Português, Русский and more.
  </p>

  <!-- Phone showing language picker grid -->
  <div class="phone" style="top: 580px; left: 50%; margin-left: -240px; transform: rotate(-1deg);">
    <div class="notch"></div>
    <div class="screen">
      <img src="../phone_screens/walk1.png">
    </div>
  </div>

  <!-- Floating language pills -->
  <div style="position:absolute; top: 780px; left: 60px; transform: rotate(-10deg);
       background: rgba(255,255,255,0.96); color: #18181b; padding: 16px 24px;
       border-radius: 16px; font-weight: 800; font-size: 36px; z-index: 3;
       box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    हिन्दी
  </div>
  <div style="position:absolute; top: 1180px; right: 60px; transform: rotate(8deg);
       background: rgba(255,255,255,0.96); color: #18181b; padding: 16px 24px;
       border-radius: 16px; font-weight: 800; font-size: 36px; z-index: 3;
       box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    العربية
  </div>
  <div style="position:absolute; top: 1400px; left: 50px; transform: rotate(-6deg);
       background: rgba(255,255,255,0.96); color: #18181b; padding: 16px 24px;
       border-radius: 16px; font-weight: 800; font-size: 36px; z-index: 3;
       box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    日本語
  </div>
  <div style="position:absolute; top: 920px; right: 40px; transform: rotate(6deg);
       background: rgba(255,255,255,0.96); color: #18181b; padding: 16px 24px;
       border-radius: 16px; font-weight: 800; font-size: 36px; z-index: 3;
       box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
    Español
  </div>

  <div style="position:absolute; bottom: 80px; left: 0; right: 0; text-align: center; z-index: 5;">
    <div class="badge" style="font-size: 32px; padding: 16px 32px;">
      🌍 &nbsp; CHANGE ANYTIME, INSTANTLY
    </div>
  </div>

</div>
</body></html>
