<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  /* cinematic content for both phone + TV — same landscape image */
  .cine {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.65) 100%),
      url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=80&auto=format');
    background-size: cover;
    background-position: center;
  }
  .cine .live {
    position: absolute; top: 18px; right: 18px;
    background: rgba(0,0,0,0.55);
    color: #fff; padding: 8px 14px; border-radius: 10px;
    font-weight: 700; font-size: 18px; backdrop-filter: blur(8px);
  }
  .cine .live .dot { color: #ef4444; }
  .cine .resbadge {
    position: absolute; bottom: 18px; left: 18px;
    background: rgba(255,255,255,0.18);
    color: #fff; padding: 7px 14px; border-radius: 8px;
    font-weight: 800; font-size: 18px; backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
<div class="canvas bg-sunset">

  <div class="tag-row" style="top: 88px;">
    <div class="tag glow">● LIVE</div>
    <div class="tag">1080P HD</div>
    <div class="tag">NO WIRES</div>
  </div>

  <h1 class="headline size-xxl" style="padding-top: 200px;">
    Mirror Your Phone<br>
    To <span class="accent">Any TV</span>
  </h1>
  <p class="subhead size-md">
    Cast videos, games, photos and screen — instantly,<br>
    in cinematic HD, with one tap.
  </p>

  <!-- TV with cinematic landscape content -->
  <div class="tv" style="top: 800px; left: 110px; width: 640px; height: 390px;">
    <div class="screen">
      <div class="cine">
        <div class="live"><span class="dot">●</span> LIVE · 1:22:25</div>
        <div class="resbadge">1080P</div>
      </div>
    </div>
  </div>

  <!-- Mirror beam from phone to TV (visible as glowing arc) -->
  <div class="beam" style="top: 1240px; left: 90px; width: 720px; transform: rotate(12deg);"></div>
  <div class="signal" style="top: 1130px; right: 280px; transform: scale(0.6); opacity: 0.45;"></div>
  <div class="signal" style="top: 1090px; right: 250px; transform: scale(1.0); opacity: 0.3;"></div>

  <!-- Phone with same cinematic content (mirroring) -->
  <div class="phone" style="bottom: 280px; right: 80px; transform: rotate(-4deg);
       width: 380px; height: 800px; border-radius: 50px;">
    <div class="notch"></div>
    <div class="screen" style="background:#000;">
      <div class="cine"></div>
    </div>
  </div>

  <!-- Brand chips at bottom -->
  <div class="brand-strip" style="bottom: 50px;">
    <div class="brand-chip"><span style="color:#1428a0">SAMSUNG</span></div>
    <div class="brand-chip"><span style="color:#a50034">●</span> LG</div>
    <div class="brand-chip"><span style="color:#ff9900">fire</span>TV</div>
    <div class="brand-chip"><span style="color:#6f1ab6">Roku</span></div>
    <div class="brand-chip"><span style="color:#4285f4">G</span> Cast</div>
  </div>

</div>
</body></html>
