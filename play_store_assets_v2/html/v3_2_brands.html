<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v3.css">
<style>
  /* Big brand tiles. Each tile = the brand's signature color filling the tile,
     with the wordmark in white/contrast filling 75-85% of the tile width.
     User feedback: "tiles big, logos small" — fix by enlarging the wordmark. */
  .brand-grid {
    position: absolute;
    top: 480px; left: 60px; right: 60px; bottom: 200px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: 16px;
  }
  .tile {
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #fff;
    box-shadow: 0 12px 30px rgba(15,26,46,0.18);
    padding: 8px;
  }
  /* font-size set on each tile to fill ~80% of tile width visually */
  .tile.samsung    { background: #1428A0; font-size: 68px; letter-spacing: -0.05em; }
  .tile.lg         { background: #A50034; font-size: 124px; }
  .tile.sony       { background: #000000; font-size: 104px; }
  .tile.firetv     { background: #FF9900; font-size: 78px; color: #18181b; letter-spacing: -0.06em; }
  .tile.chromecast { background: #4285F4; font-size: 50px; letter-spacing: -0.05em; }
  .tile.roku      { background: #6E249F; font-size: 108px; letter-spacing: -0.04em; }
  .tile.hisense   { background: #008F8C; font-size: 80px; letter-spacing: -0.04em; }
  .tile.mitv      { background: #FF6900; font-size: 104px; }
  .tile.androidtv { background: #3DDC84; font-size: 60px; color: #1B5E20; letter-spacing: -0.05em; }

  /* small device-class line at top-left of each tile, low-key */
  .tile .kind {
    position: absolute; top: 14px; left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600; font-size: 14px;
    letter-spacing: 0.18em; text-transform: uppercase;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="canvas surf-paper grid-bg">

  <div style="position:absolute; top: 80px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;">
    <div class="air-logo size-md">
      <div class="mark"><div class="rect-green"></div><div class="rect-blue"></div></div>
      <span class="name" style="font-size: 36px;">AIRCAST</span>
    </div>
    <div class="label" style="color: var(--air-ink); opacity: 0.55;">02 / COMPATIBILITY</div>
  </div>

  <h1 class="mono h-110" style="position: absolute; top: 220px; left: 80px; right: 80px;">
    EVERY TV.<br>
    EVERY <span style="color: var(--air-blue);">STICK.</span>
  </h1>
  <p class="serif-italic t-36" style="position: absolute; top: 420px; left: 80px; right: 320px;
       color: var(--air-ink); opacity: 0.7;">
    Works with the smart TV or streaming device you already own.
  </p>

  <!-- 3 columns x 3 rows actually, to fit 9 brands; over-ride grid -->
  <div class="brand-grid" style="grid-template-columns: repeat(3, 1fr); gap: 14px;">
    <div class="tile samsung"><span class="kind">Smart TV</span>SAMSUNG</div>
    <div class="tile lg"><span class="kind">Smart TV</span>LG</div>
    <div class="tile sony"><span class="kind">Bravia</span>SONY</div>
    <div class="tile firetv"><span class="kind">Stick</span>fireTV</div>
    <div class="tile chromecast"><span class="kind">Google</span>chromecast</div>
    <div class="tile roku"><span class="kind">Stick</span>Roku</div>
    <div class="tile hisense"><span class="kind">Smart TV</span>Hisense</div>
    <div class="tile mitv"><span class="kind">Mi TV</span>mitv</div>
    <div class="tile androidtv"><span class="kind">OS</span>AndroidTV</div>
  </div>

  <!-- footer: count + tag -->
  <div style="position: absolute; bottom: 110px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;">
    <span class="tag" style="color: var(--air-ink);"><span class="dot"></span>11+ BRANDS SUPPORTED</span>
    <p class="serif-italic t-28" style="color: var(--air-ink); opacity: 0.55;">
      + TCL, Vizio, Bravia, Panasonic
    </p>
  </div>

</div>
</body></html>
