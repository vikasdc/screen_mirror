<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v3.css">
<style>
  /* Massive single numeral filling 60% of canvas height.
     Rhythm break in the carousel — scroll stopper. */
  .blue-panel {
    position: absolute; inset: 0;
    background: #4285F4;
  }
  .one {
    position: absolute;
    top: 280px; left: 0; right: 0;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 1100px;
    line-height: 0.85;
    color: #FAFAF7;
    letter-spacing: -0.08em;
    text-shadow: 16px 16px 0 rgba(15,26,46,0.55);
  }
  .one .ms {
    /* small numerical suffix to break the rigid singularity */
    position: absolute;
    top: 80px; right: 220px;
    font-size: 56px;
    font-weight: 600;
    color: #FAFAF7;
    opacity: 0.7;
    letter-spacing: 0;
    text-shadow: none;
  }
  .neopop {
    box-shadow:
      8px 8px 0 0 rgba(15,26,46,0.85),
      0 0 0 3px rgba(15,26,46,0.85);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="blue-panel"></div>

  <!-- top: logo + label -->
  <div style="position:absolute; top: 80px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;
       color: #FAFAF7;">
    <div class="air-logo size-md" style="color: #FAFAF7;">
      <div class="mark">
        <div class="rect-green" style="background: rgba(255,255,255,0.55);"></div>
        <div class="rect-blue" style="background: #FAFAF7;"></div>
      </div>
      <span class="name" style="font-size: 36px;">AIRCAST</span>
    </div>
    <div class="label" style="color: #FAFAF7; opacity: 0.7;">05 / SPEED</div>
  </div>

  <!-- The numeral 1 -->
  <div class="one">
    <span class="ms">tap</span>
    1
  </div>

  <!-- lowercase erode tagline below the numeral -->
  <p class="serif-italic" style="position: absolute; bottom: 320px; left: 0; right: 0;
       font-size: 64px; line-height: 1.1; color: #FAFAF7; text-align: center;
       font-style: italic; font-weight: 400;">
    tap to cast.<br>
    that's it.
  </p>

  <!-- tiny phone in lower-right with the cast button highlighted -->
  <div class="phone neopop" style="bottom: 80px; right: 80px; width: 200px; height: 420px; border-radius: 26px;">
    <div class="notch" style="width: 56px; height: 14px; top: 14px;"></div>
    <div class="scr" style="background: #0F1A2E; padding: 56px 14px 14px;">
      <!-- mini mock of the home screen with Search for TVs visible -->
      <div style="background: #1A2C45; border-radius: 12px; padding: 14px; margin-bottom: 10px;
           font: 700 11px 'JetBrains Mono', monospace; color: #FAFAF7; letter-spacing: 0.08em;
           text-align: center;">
        CONNECT TO TV
      </div>
      <div style="background: #34A853; border-radius: 100px; padding: 16px 18px;
           font: 800 13px 'JetBrains Mono', monospace; color: #FAFAF7;
           text-align: center; letter-spacing: 0.04em;
           box-shadow: 0 0 0 4px rgba(52,168,83,0.35);">
        SEARCH FOR TVs
      </div>
      <p style="font: 400 italic 9px Erode, serif; color: rgba(250,250,247,0.55);
         text-align: center; margin-top: 14px;">
        Scan and connect to displays nearby
      </p>
    </div>
  </div>

  <!-- bottom-left tag for time-spec -->
  <div style="position: absolute; bottom: 100px; left: 80px;">
    <div class="tag" style="color: #FAFAF7; border-color: rgba(255,255,255,0.6);">
      <span class="dot" style="background: #FAFAF7;"></span>
      AVG SETUP · 2 SECONDS
    </div>
  </div>

</div>
</body></html>
