<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v2.css">
<style>
  .half-dark {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 50%;
    background: #0B0D10;
    color: #F4F4F2;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
  }
  .half-light {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 50%;
    background: #F4EFE7;
    color: #1B1A17;
    clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%);
  }
  .panel {
    position: absolute;
    inset: 0;
    padding: 120px 80px 80px;
    display: flex; flex-direction: column;
    justify-content: space-between;
  }
  .panel .label {
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 22px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .panel .title {
    font-family: 'Instrument Serif', serif;
    font-size: 96px; letter-spacing: -0.025em; line-height: 0.92;
  }
  .half-dark .title em { color: #7AE0C2; font-style: italic; }
  .half-light .title em { color: #2E5D4F; font-style: italic; }

  .mini-phone {
    width: 220px; height: 460px;
    border-radius: 28px;
    background: #0A0A0A;
    border: 3px solid #1A1A1A;
    overflow: hidden;
    margin: 0 auto 40px;
    box-shadow: 0 30px 50px rgba(0,0,0,0.4);
  }
  .half-light .mini-phone {
    box-shadow: 0 30px 50px rgba(60,40,20,0.2);
  }
  .mini-phone .scr {
    position: absolute; inset: 8px; border-radius: 22px;
    overflow: hidden;
  }
  .mini-phone .scr img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

  .seam {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.5) 30%, rgba(0,0,0,0.5) 70%, transparent 100%);
    transform: translateX(-0.5px) skewX(-4deg);
    transform-origin: 50% 50%;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- dark half (left) -->
  <div class="half-dark">
    <div class="panel">
      <div>
        <div class="label" style="color:#7AE0C2; opacity: 0.9;">06 &nbsp; NIGHT</div>
        <h2 class="title" style="margin-top: 80px;">
          For the<br>
          late <em>movie.</em>
        </h2>
      </div>

      <!-- abstract UI card (dark theme) -->
      <div style="position: relative; padding: 0 50px 50px;">
        <div style="background: #15181D; border: 1px solid rgba(255,255,255,0.08);
             border-radius: 24px; padding: 28px;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span class="live-dot"></span>
            <span class="sans" style="font: 500 18px Inter; color:#8A8F98;">Connected</span>
            <span style="margin-left: auto; color:#7AE0C2; font: 700 18px Inter;">Samsung TV</span>
          </div>
          <div style="background: #0B0D10; border-radius: 12px; height: 110px;
               display: flex; align-items: center; justify-content: center; gap: 8px;">
            <div style="width: 4px; height: 24px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 42px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 18px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 56px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 32px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 48px; background: #7AE0C2; border-radius: 2px;"></div>
            <div style="width: 4px; height: 26px; background: #7AE0C2; border-radius: 2px;"></div>
          </div>
        </div>
        <p class="sans" style="font-size: 22px; color:#8A8F98; text-align: center;
             letter-spacing: -0.005em; margin-top: 24px;">
          Dark mode + low-glare casting after sunset.
        </p>
      </div>
    </div>
  </div>

  <!-- light half (right) -->
  <div class="half-light">
    <div class="panel">
      <div>
        <div class="label" style="color:#2E5D4F; opacity: 0.9;">07 &nbsp; DAY</div>
        <h2 class="title" style="margin-top: 80px;">
          For the<br>
          quick <em>recipe.</em>
        </h2>
      </div>

      <!-- abstract UI card (light theme) -->
      <div style="position: relative; padding: 0 50px 50px;">
        <div style="background: #FFFFFF; border: 1px solid #E5DAC8;
             border-radius: 24px; padding: 28px;
             box-shadow: 0 20px 40px rgba(60,40,20,0.06);">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
            <span style="width: 12px; height: 12px; border-radius: 50%;
                 background: #2E5D4F; box-shadow: 0 0 10px rgba(46,93,79,0.4);"></span>
            <span class="sans" style="font: 500 18px Inter; color:#6C6760;">Connected</span>
            <span style="margin-left: auto; color:#2E5D4F; font: 700 18px Inter;">LG OLED</span>
          </div>
          <div style="background: #F4EFE7; border-radius: 12px; height: 110px;
               display: flex; align-items: center; justify-content: center; gap: 8px;">
            <div style="width: 4px; height: 24px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 42px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 18px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 56px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 32px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 48px; background: #2E5D4F; border-radius: 2px;"></div>
            <div style="width: 4px; height: 26px; background: #2E5D4F; border-radius: 2px;"></div>
          </div>
        </div>
        <p class="sans" style="font-size: 22px; color:#6C6760; text-align: center;
             letter-spacing: -0.005em; margin-top: 24px;">
          Light mode that disappears in daylight.
        </p>
      </div>
    </div>
  </div>

  <!-- diagonal seam -->
  <div class="seam"></div>

  <!-- center wordmark -->
  <div style="position: absolute; top: 50%; left: 50%;
       transform: translate(-50%, -50%);
       font-family: 'Instrument Serif', serif; font-size: 48px;
       color: rgba(255,255,255,0.0);">
    <!-- intentionally empty; brand appears on each side -->
  </div>

</div>
</body></html>
