<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v2.css">
<style>
  /* warm interior backdrop, duotone-tinted to our palette */
  .interior {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(11,13,16,0.20) 0%, rgba(11,13,16,0.55) 70%, rgba(11,13,16,0.85) 100%),
      url('https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=1400&q=85&auto=format');
    background-size: cover; background-position: center;
  }
  /* a long sweeping shadow under the phone — implies "held just out of frame" */
  .phone-shadow {
    position: absolute;
    bottom: 60px; right: 60px;
    width: 460px; height: 80px;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.6) 0%,
      rgba(0,0,0,0.2) 40%,
      rgba(0,0,0,0) 70%);
    filter: blur(20px);
    z-index: 2;
  }
  .same-content {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%),
      url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=85&auto=format');
    background-size: cover; background-position: center;
  }
</style>
</head>
<body>
<div class="canvas surf-dark">
  <div class="interior"></div>

  <!-- chapter marker, top-left over the photo -->
  <div class="cap tl" style="color: #F4F4F2; mix-blend-mode: normal;">
    <div class="eyebrow"><span class="num">02</span> &nbsp; A LIVING ROOM &nbsp;/&nbsp; 7:14 PM</div>
  </div>

  <!-- TV mounted-style on the wall — replacing the interior's actual TV with our mirror content -->
  <div class="tv" style="top: 540px; left: 140px;">
    <div class="scr">
      <div class="same-content">
        <div style="position:absolute; top:18px; right:18px;
             background: rgba(0,0,0,0.55); color:#fff;
             padding: 6px 12px; border-radius: 8px;
             font: 700 18px Inter; backdrop-filter: blur(8px);">
          ● LIVE · 1:22:25
        </div>
        <div style="position:absolute; bottom:18px; left:18px;
             background: rgba(255,255,255,0.2); color:#fff;
             padding: 5px 12px; border-radius: 6px;
             font: 800 16px Inter;">1080P</div>
      </div>
    </div>
  </div>

  <!-- mint mirror line connecting TV to phone -->
  <div class="mirror-line" style="top: 1110px; left: 580px; width: 320px; transform: rotate(35deg);"></div>

  <!-- the held phone, tilted naturally -->
  <div class="phone" style="bottom: 60px; right: 100px;
       width: 360px; height: 760px; border-radius: 46px;
       transform: rotate(-12deg); z-index: 5;">
    <div class="notch"></div>
    <div class="scr" style="background: #000;">
      <div class="same-content"></div>
    </div>
  </div>

  <!-- soft shadow implying phone is held just below the frame -->
  <div class="phone-shadow"></div>

  <!-- editorial caption at TOP-LEFT below the chapter marker, well clear of the phone -->
  <h2 class="serif" style="position: absolute; top: 220px; left: 80px; right: 400px;
       font-size: 96px; line-height: 0.95;">
    Same screen.<br>
    <em>Bigger</em> moment.
  </h2>
  <p class="sans" style="position: absolute; top: 470px; left: 80px; right: 400px;
       font-size: 26px; color: rgba(244,244,242,0.72); letter-spacing: -0.005em;
       line-height: 1.35;">
    The phone in your hand. The same picture on the TV on the wall. One tap, no setup.
  </p>

</div>
</body></html>
