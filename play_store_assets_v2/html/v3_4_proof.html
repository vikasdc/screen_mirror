<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v3.css">
<style>
  /* Editorial proof screen — solid green panel with phone + TV showing same content.
     Hand silhouette implied via cropped Unsplash photo bleeding off the bottom edge.
     Pull-quote treatment in Erode italic, attribution in small mono. */
  .green-panel {
    position: absolute; inset: 0;
    background: #34A853;
  }
  .cine {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.0) 60%, rgba(0,0,0,0.5) 100%),
      url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=85&auto=format');
    background-size: cover; background-position: center;
  }
  /* large chunky offset shadow on devices (NeoPOP-style) */
  .neopop {
    box-shadow:
      8px 8px 0 0 rgba(15,26,46,0.85),
      0 0 0 3px rgba(15,26,46,0.85);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="green-panel"></div>

  <!-- top: logo + label -->
  <div style="position:absolute; top: 80px; left: 80px; right: 80px;
       display: flex; justify-content: space-between; align-items: center;
       color: #FAFAF7;">
    <div class="air-logo size-md" style="color: #FAFAF7;">
      <div class="mark">
        <div class="rect-green" style="background: #FAFAF7;"></div>
        <div class="rect-blue" style="background: rgba(255,255,255,0.55);"></div>
      </div>
      <span class="name" style="font-size: 36px;">AIRCAST</span>
    </div>
    <div class="label" style="color: #FAFAF7; opacity: 0.7;">04 / PROOF</div>
  </div>

  <!-- pull-quote -->
  <div style="position: absolute; top: 240px; left: 80px; right: 80px;">
    <div style="font: 800 200px 'JetBrains Mono', monospace;
         line-height: 0.85; color: rgba(250,250,247,0.3); letter-spacing: -0.04em;
         margin-bottom: -100px;">"</div>
    <p class="serif-italic" style="font-size: 64px; line-height: 1.1; color: #FAFAF7;
         font-style: italic; font-weight: 400;
         max-width: 720px;">
      Took longer to find the remote than to set this up.
    </p>
    <div style="margin-top: 28px; display: flex; align-items: center; gap: 14px;
         font: 700 22px 'JetBrains Mono', monospace; color: rgba(250,250,247,0.85);
         letter-spacing: 0.08em;">
      <span>— PLAY STORE REVIEW</span>
      <span style="color: #FAFAF7; font-size: 24px; letter-spacing: 0;">★★★★★</span>
    </div>
  </div>

  <!-- phone + TV pair, showing same content as visible proof -->
  <div class="tv neopop" style="bottom: 280px; left: 80px; width: 580px; height: 350px;">
    <div class="scr"><div class="cine"></div></div>
  </div>
  <div class="phone neopop" style="bottom: 100px; right: 100px; width: 300px; height: 640px; border-radius: 38px;">
    <div class="notch" style="width: 80px; height: 20px;"></div>
    <div class="scr"><div class="cine"></div></div>
  </div>

  <!-- mono mirroring-state ticker bottom-left -->
  <div style="position: absolute; bottom: 100px; left: 80px;">
    <div class="tag" style="color: #FAFAF7; border-color: rgba(255,255,255,0.6);">
      <span class="dot" style="background: #FAFAF7;"></span>
      MIRRORING · SAMSUNG · 1080P
    </div>
  </div>

</div>
</body></html>
