<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v2.css">
<style>
  /* editorial wordmark presentation — no 3x3 tile grid */
  .brands {
    position: absolute;
    top: 480px; left: 80px; right: 80px; bottom: 240px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.92;
  }
  .row1 { font-size: 128px; }
  .row2 { font-size: 108px; }
  .row3 { font-size: 76px; }
  .row4 { font-size: 64px; }
  .row5 { font-size: 56px; }

  .wm {
    display: inline-flex;
    align-items: baseline;
    padding-bottom: 8px;
    border-bottom: 2px solid rgba(27,26,23,0.15);
  }
  .wm .acc-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #7AE0C2;
    display: inline-block;
    margin-left: 12px;
    vertical-align: 16px;
    flex-shrink: 0;
    align-self: center;
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 36px;
    flex-wrap: nowrap;
  }
</style>
</head>
<body>
<div class="canvas surf-cream grid-cream">

  <div class="cap tl">
    <div class="eyebrow"><span class="num">03</span> &nbsp; COMPATIBILITY</div>
  </div>

  <h1 class="serif" style="position: absolute; top: 200px; left: 80px; right: 80px;
       font-size: 112px;">
    Works with the TV<br>
    you <em>already own.</em>
  </h1>

  <!-- brand wordmarks set huge, editorial -->
  <div class="brands">
    <div class="row1 row">
      <span class="wm c-samsung">SAMSUNG<span class="acc-dot"></span></span>
    </div>
    <div class="row2 row">
      <span class="wm c-lg">LG</span>
      <span class="wm c-sony">SONY</span>
    </div>
    <div class="row3 row">
      <span class="wm c-roku">Roku</span>
      <span class="wm c-firetv">fire&nbsp;TV</span>
      <span class="wm c-chrome">chromecast</span>
    </div>
    <div class="row4 row">
      <span class="wm c-hisense">Hisense</span>
      <span class="wm c-mi">Mi&nbsp;TV</span>
      <span class="wm c-android">Android&nbsp;TV</span>
    </div>
    <div class="row5 row">
      <span class="wm c-tcl">TCL</span>
      <span class="wm c-vizio">VIZIO</span>
      <span class="wm c-bravia">BRAVIA</span>
      <span class="sans muted" style="font-weight: 500; font-size: 56px; padding-bottom: 8px;">+ more</span>
    </div>
  </div>

  <!-- footer note -->
  <p class="sans" style="position: absolute; bottom: 100px; left: 80px; right: 80px;
       font-size: 24px; color: #6C6760; letter-spacing: 0.04em;">
    A.&nbsp; Aircast supports any TV or streaming device with Miracast, Google Cast or
    Wireless Display protocols.
  </p>

</div>
</body></html>
