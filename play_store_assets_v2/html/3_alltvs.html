<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="canvas bg-cobalt">

  <h1 class="headline size-xl" style="padding-top: 140px;">
    Works With <span class="accent">Every</span><br>
    Smart TV & Stick
  </h1>
  <p class="subhead size-md">
    Samsung, LG, Sony, Mi, Hisense, TCL, Vizio,<br>
    Chromecast, Fire TV, Roku, Android TV — all in.
  </p>

  <div class="brand-grid" style="grid-template-columns: repeat(3, 1fr); inset: 460px 60px 200px 60px;">
    <div class="brand-tile samsung" style="font-size: 48px;">SAMSUNG</div>
    <div class="brand-tile lg">LG</div>
    <div class="brand-tile sony" style="font-size: 56px;">SONY</div>
    <div class="brand-tile fire" style="font-size: 44px;">fireTV</div>
    <div class="brand-tile chrome" style="font-size: 40px;">chromecast</div>
    <div class="brand-tile hisense" style="font-size: 44px;">Hisense</div>
    <div class="brand-tile mi" style="font-size: 56px;">Mi TV</div>
    <div class="brand-tile roku" style="font-size: 56px;">Roku</div>
    <div class="brand-tile androidtv">Android TV</div>
  </div>

  <!-- Stats badge -->
  <div style="position:absolute; bottom: 60px; left: 0; right: 0; text-align: center; z-index: 5;">
    <div class="badge" style="font-size: 32px; padding: 16px 32px;">
      <span style="color: #00e5a8">●</span> &nbsp; 11+ BRANDS · 99% COMPATIBILITY
    </div>
  </div>

</div>
</body></html>
