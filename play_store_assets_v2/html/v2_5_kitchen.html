<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v2.css">
<style>
  .interior {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(11,13,16,0.30) 0%, rgba(11,13,16,0.70) 100%),
      url('https://images.unsplash.com/photo-1631679706909-1844bbd07221?w=1400&q=85&auto=format');
    background-size: cover; background-position: center;
  }
  .same-content {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,0.6) 100%),
      url('https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=1200&q=85&auto=format');
    background-size: cover; background-position: center;
  }
  .phone-shadow {
    position: absolute;
    bottom: 60px; left: 60px;
    width: 460px; height: 80px;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.6) 0%,
      rgba(0,0,0,0.2) 40%,
      rgba(0,0,0,0) 70%);
    filter: blur(20px);
    z-index: 2;
  }
</style>
</head>
<body>
<div class="canvas surf-dark">
  <div class="interior"></div>

  <div class="cap tl" style="color: #F4F4F2;">
    <div class="eyebrow"><span class="num">05</span> &nbsp; A BEDROOM &nbsp;/&nbsp; 10:48 PM</div>
  </div>

  <!-- TV on the kitchen wall mirroring same recipe content -->
  <div class="tv" style="top: 480px; right: 100px; width: 720px; height: 430px;">
    <div class="scr">
      <div class="same-content">
        <div style="position:absolute; bottom:18px; left:18px;
             background: rgba(255,255,255,0.2); color:#fff;
             padding: 5px 12px; border-radius: 6px;
             font: 800 16px Inter;">1080P</div>
        <div style="position:absolute; top:18px; right:18px;
             background: rgba(0,0,0,0.55); color:#fff;
             padding: 6px 12px; border-radius: 8px;
             font: 700 18px Inter;">● LIVE</div>
      </div>
    </div>
  </div>

  <!-- mirror line phone-to-TV -->
  <div class="mirror-line" style="top: 1100px; right: 400px; width: 360px; transform: rotate(-30deg);"></div>

  <!-- the held phone, tilted opposite to scene 2 -->
  <div class="phone" style="bottom: 80px; left: 120px;
       width: 360px; height: 760px; border-radius: 46px;
       transform: rotate(14deg); z-index: 5;">
    <div class="notch"></div>
    <div class="scr" style="background:#000;">
      <div class="same-content"></div>
    </div>
  </div>

  <!-- soft shadow implying phone is held just below the frame -->
  <div class="phone-shadow"></div>

  <!-- editorial caption at BOTTOM, clear of TV-top-right and phone-bottom-left -->
  <h2 class="serif" style="position: absolute; bottom: 200px; left: 80px; right: 80px;
       font-size: 96px; line-height: 0.95; text-align: right;">
    Lie back.<br>
    Watch <em>bigger.</em>
  </h2>
  <p class="sans" style="position: absolute; bottom: 110px; left: 460px; right: 80px;
       font-size: 26px; color: rgba(244,244,242,0.78); letter-spacing: -0.005em;
       text-align: right; line-height: 1.35;">
    The phone stays in your hand. The picture moves across the room.
  </p>

</div>
</body></html>
