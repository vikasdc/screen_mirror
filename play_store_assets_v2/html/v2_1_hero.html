<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles_v2.css">
</head>
<body>
<div class="canvas surf-dark">

  <!-- chapter marker -->
  <div class="cap tl">
    <div class="eyebrow"><span class="num">01</span> &nbsp; AIRCAST &nbsp;/&nbsp; THE OVERVIEW</div>
  </div>

  <!-- editorial headline, asymmetric -->
  <h1 class="serif h-160" style="position: absolute; top: 200px; left: 80px; right: 80px;">
    Phone,<br>
    on <em>TV.</em><br>
    <span style="color:#7AE0C2; font-style: italic; font-size: 84px; vertical-align: 18px;">One tap.</span>
  </h1>

  <!-- shared cinematic content for both screens (mountain landscape) -->
  <style>
    .cine-content {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%),
        url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=85&auto=format');
      background-size: cover; background-position: center;
    }
    .cine-content .lv {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.55); color: #fff;
      padding: 6px 12px; border-radius: 8px;
      font: 700 18px Inter;
    }
    .cine-content .rs {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(255,255,255,0.18); color: #fff;
      padding: 5px 12px; border-radius: 6px;
      font: 800 16px Inter;
    }
  </style>

  <!-- TV (back layer, slightly inset from left edge) -->
  <div class="tv float-shadow" style="top: 920px; left: 80px; width: 680px; height: 410px;">
    <div class="scr">
      <div class="cine-content">
        <div class="lv">● LIVE · 1:22:25</div>
        <div class="rs">1080P</div>
      </div>
    </div>
  </div>

  <!-- mirror line between phone and TV -->
  <div class="mirror-line" style="top: 1340px; left: 720px; width: 240px; transform: rotate(18deg);"></div>

  <!-- phone (front layer, overlapping TV) -->
  <div class="phone float-shadow" style="top: 1080px; right: 70px;
       width: 340px; height: 720px; border-radius: 44px;">
    <div class="notch"></div>
    <div class="scr">
      <div class="cine-content"></div>
    </div>
  </div>

  <!-- live ticker bottom-left -->
  <div style="position: absolute; bottom: 100px; left: 80px;">
    <div class="live-ticker"><span class="live-dot"></span>MIRRORING · 1080P · &lt;200MS</div>
  </div>

  <!-- footer wordmark -->
  <div style="position: absolute; bottom: 100px; right: 80px;
       font-family: 'Instrument Serif', serif; font-size: 42px; letter-spacing: -0.02em;">
    Aircast<span style="color:#7AE0C2">.</span>
  </div>

</div>
</body></html>
