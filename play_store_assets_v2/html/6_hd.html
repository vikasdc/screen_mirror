<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  .cine {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%),
      url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1200&q=80&auto=format');
    background-size: cover; background-position: center;
  }
  .cine .timer {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,0.55); color: #fff;
    padding: 8px 14px; border-radius: 10px;
    font-weight: 700; font-size: 18px;
  }
  .cine .resbadge {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(255,255,255,0.2); color: #fff;
    padding: 7px 14px; border-radius: 8px;
    font-weight: 800; font-size: 18px;
  }
</style>
</head>
<body>
<div class="canvas bg-volt">

  <div class="tag-row" style="top: 88px;">
    <div class="tag glow">● REAL-TIME</div>
    <div class="tag">FULL HD</div>
    <div class="tag">LOW LATENCY</div>
  </div>

  <h1 class="headline size-xl" style="padding-top: 200px;">
    Stunning HD.<br>
    <span style="background: linear-gradient(180deg, #00e5a8 0%, #00bfa5 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block;">Zero Lag.</span>
  </h1>
  <p class="subhead size-md">
    Stream movies, mirror games, share photo galleries —<br>
    pin-sharp, frame-perfect, instant.
  </p>

  <!-- TV with cinematic content -->
  <div class="tv" style="top: 800px; left: 100px; width: 640px; height: 390px;">
    <div class="screen">
      <div class="cine">
        <div class="timer">● 1:22:25</div>
        <div class="resbadge">1080P · 60fps</div>
      </div>
    </div>
  </div>

  <!-- Signal arcs from phone toward TV -->
  <div class="signal" style="top: 1200px; left: 690px; transform: scale(0.7); opacity: 0.6;"></div>
  <div class="signal" style="top: 1170px; left: 670px; transform: scale(1.05); opacity: 0.35;"></div>

  <!-- Phone with same content -->
  <div class="phone" style="bottom: 110px; right: 80px;
       width: 360px; height: 760px; border-radius: 48px; transform: rotate(4deg);">
    <div class="notch"></div>
    <div class="screen" style="background: #000;">
      <div class="cine"></div>
    </div>
  </div>

</div>
</body></html>
