<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="canvas bg-emerald">

  <h1 class="headline size-xxl" style="padding-top: 140px;">
    Free. Forever.<br>
    <span class="accent">No Ads.</span>
  </h1>
  <p class="subhead size-md">
    No sign-ups, no subscriptions, no banner ads.<br>
    Just a button that puts your phone on the TV.
  </p>

  <!-- Phone showing clean home -->
  <div class="phone" style="top: 600px; left: 50%; margin-left: -240px; transform: rotate(2deg);">
    <div class="notch"></div>
    <div class="screen">
      <img src="../phone_screens/home_en.png">
    </div>
  </div>

  <!-- Three big value-prop tags -->
  <div style="position:absolute; bottom: 130px; left: 0; right: 0;
       display: flex; justify-content: center; gap: 24px; z-index: 5; padding: 0 60px;">
    <div class="tag glow" style="font-size: 28px; padding: 18px 28px;">✓ 0 ADS</div>
    <div class="tag glow" style="font-size: 28px; padding: 18px 28px;">✓ 0 SIGN-UP</div>
    <div class="tag glow" style="font-size: 28px; padding: 18px 28px;">✓ 0 TRACKERS</div>
  </div>

</div>
</body></html>
