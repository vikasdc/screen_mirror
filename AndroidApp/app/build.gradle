plugins {
    id 'com.android.application'
}

// Read release-signing creds from app/keystore.properties if it exists. The
// file stays gitignored. See keystore.properties.example for the schema.
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.screenmirror'
    compileSdk 35

    defaultConfig {
        applicationId "com.screenmirror"
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName "1.5"

        // Restrict packaged locales to the ones we actually ship.
        // Without this, AppCompat's full set of ~80 locales bloats the APK.
        resConfigs "en", "es", "pt-rBR", "hi", "in", "ru", "de", "fr",
                "it", "ja", "ko", "zh-rCN", "tr", "vi", "ar"

        // AdMob IDs. Defaults are Google's official TEST IDs — safe to ship,
        // never serve real ads, never charge you. Release builds override
        // these with the production values from the AdMob console.
        // App ID is injected into AndroidManifest via manifestPlaceholders.
        // Ad unit IDs are injected as BuildConfig fields and read at runtime
        // (see MainActivity).
        manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"ca-app-pub-3940256099942544/6300978111\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Only attach the production signing config when keystore.properties
            // is present. Without it, release builds produce an unsigned APK
            // (useful for size analysis) but bundleRelease for Play upload still
            // requires the file.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }

            // PRODUCTION AdMob IDs. App ID + Banner Unit ID for "Aircast Home Banner".
            // Created in AdMob console, Apps, Aircast, Ad units.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3814847756285692~3539815988"]
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"ca-app-pub-3814847756285692/7158811030\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // AdMob banner ads. The play-services-ads artifact pulls in the
    // Google Mobile Ads SDK which handles ad serving, fill, and analytics.
    // Lite variant would drop ~3MB but trades off some features; stick with
    // full SDK until APK size becomes a problem.
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
}
